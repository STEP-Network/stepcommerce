<!-- STEP Commerce — GAM HTML5 custom creative wrapper (spec §7).
     Traffic as a "Custom" / HTML5 creative. KVs are injected by GAM via
     %%PATTERN%% macros at render time — the creative NEVER reads googletag
     from inside the SafeFrame. %%CLICK_URL_UNESC%% gives GAM click parity.
     Replace the placement code and the KV keys with the placement's actual
     targeting keys (the admin's snippet generator does this automatically). -->
<script src="https://stepnetwork.dk/stepcommerce/w.js"></script>
<script>
  window.STEPCommerce && window.STEPCommerce.init({
    placement: "PLC_REPLACE_ME",
    serveUrl: "https://stepnetwork.dk/stepcommerce/api/serve",
    clickMacro: "%%CLICK_URL_UNESC%%",
    kv: {
      "mv_cat": "%%PATTERN:mv_cat%%",
      "mv_ingredients": "%%PATTERN:mv_ingredients%%",
      "mv_page": "%%PATTERN:mv_page%%",
      "limited_ads": "%%PATTERN:limited_ads%%"
    }
  });
</script>
